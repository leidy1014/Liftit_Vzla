<div class="admin-page-header">
  <div>
    <h2 class="admin-page-title">Categorías</h2>
    <p class="admin-page-subtitle">Organiza tus productos por categoría</p>
  </div>
  <button mat-raised-button color="primary" (click)="toggleFormulario()">
    {{ mostrarFormulario() ? 'Cancelar' : '+ Nueva Categoría' }}
  </button>
</div>

@if (mostrarFormulario()) {
  <div class="admin-form-card">
    <h3 style="margin: 0 0 1rem; font-size: 1rem; font-weight: 600;">
      {{ editando() ? 'Editar categoría' : 'Nueva categoría' }}
    </h3>
    <form [formGroup]="form" (ngSubmit)="guardar()" style="display: flex; flex-direction: column; gap: 1rem;">
      <mat-form-field>
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="descripcion" />
      </mat-form-field>
      <div style="display: flex; gap: 0.5rem;">
        <button mat-raised-button color="primary" type="submit">Guardar</button>
        <button mat-button type="button" (click)="cancelar()">Cancelar</button>
      </div>
    </form>
  </div>
}

<div class="admin-table-container">
  <table mat-table [dataSource]="categorias()" style="width: 100%;">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let p">{{ p.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let p">{{ p.activo ? 'Activo' : 'Inactivo' }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button color="primary" (click)="editar(p)" title="Editar">
          <i class="fas fa-pencil-alt"></i>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(p.id)" title="Eliminar">
          <i class="fas fa-trash"></i>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
</div>
